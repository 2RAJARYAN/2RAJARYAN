name: Generate Snake

# run daily at 00:00 UTC and allow manual runs
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# allow writes so the action can push the output branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      # optional but useful for debugging / future steps
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: 2RAJARYAN
          outputs: |
            dist/github-contribution-grid-snake.svg

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
